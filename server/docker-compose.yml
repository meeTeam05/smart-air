name: smart-air

services:
  # Reverse proxy — public entry point via Cloudflare Tunnel
  nginx:
    image: nginx:alpine
    container_name: sa-nginx
    ports:
      - "80:80"
      - "443:443" # HTTPS — OTA firmware file server (uses EMQX cert)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./emqx/certs:/etc/nginx/certs:ro # reuse EMQX self-signed cert
      - ./ota-files:/var/www/ota:ro # firmware binaries drop zone
    depends_on:
      api:     { condition: service_healthy }
      emqx:    { condition: service_healthy }
      grafana: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sa-net

  # MQTT broker
  emqx:
    image: emqx/emqx:latest
    container_name: sa-emqx
    ports:
      - "8083:8083"                  # WebSocket — Flutter app via nginx /mqtt
      - "8883:8883"                  # MQTT/TLS — ESP32 firmware
      - "127.0.0.1:18083:18083"     # dashboard — localhost only
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-changeme}
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE:-changeme_node_cookie}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/certs:/opt/emqx/etc/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status | grep running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - sa-net

  # API — Fastify service
  api:
    image: node:20-alpine
    container_name: sa-api
    working_dir: /app
    volumes:
      - ./api:/app
      - ./db:/db:ro
    command: sh -c "npm install && npm run migrate && node src/app.js"
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      emqx:     { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - sa-net

  # Database — TimescaleDB (PostgreSQL + time-series)
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartair}
      POSTGRES_USER: ${POSTGRES_USER:-smartair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartair}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sa-net

  # Cache + command queue
  redis:
    image: redis:7-alpine
    container_name: sa-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --save 60 1 --loglevel warning
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sa-net

  # Grafana — telemetry dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: sa-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sa-net

  # pgAdmin — database management UI
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sa-pgadmin
    ports:
      - "127.0.0.1:5050:80"         # localhost only
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - sa-net

  # Portainer — Docker management UI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: sa-portainer
    ports:
      - "127.0.0.1:9000:9000"       # localhost only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    restart: unless-stopped
    networks:
      - sa-net

  # Cloudflare Tunnel — public ingress
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sa-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    restart: unless-stopped
    depends_on:
      nginx: { condition: service_healthy }
    networks:
      - sa-net

volumes:
  emqx-data:
  emqx-log:

networks:
  sa-net:
    driver: bridge
