name: smart-air

services:
  # ─────────────────────────────────────────────────
  # Reverse proxy — public entry point via Cloudflare Tunnel
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sa-nginx
    ports:
      - "80:80"
      - "443:443"    # HTTPS — OTA firmware file server (uses EMQX cert)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./emqx/certs:/etc/nginx/certs:ro      # reuse EMQX self-signed cert
      - ./ota-files:/var/www/ota:ro            # firmware binaries drop zone
    depends_on:
      - api
      - emqx
      - grafana
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # MQTT broker
  # Phase 1.1: plain defaults
  # Phase 1.2: add TLS, auth, ACL
  # ─────────────────────────────────────────────────
  emqx:
    image: emqx/emqx:latest
    container_name: sa-emqx
    ports:
      - "8083:8083"    # WebSocket — Flutter app via nginx /mqtt
      - "8883:8883"    # MQTT/TLS — ESP32 firmware
      - "18083:18083"  # dashboard — LAN only, do not expose publicly
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-changeme}
    volumes:
      - ./emqx/data:/opt/emqx/data
      - ./emqx/log:/opt/emqx/log
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/certs:/opt/emqx/etc/certs:ro
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # API — placeholder (replaced with Fastify in Phase 3)
  # ─────────────────────────────────────────────────
  api:
    image: node:20-alpine
    container_name: sa-api
    working_dir: /app
    volumes:
      - ./api:/app
    command: sh -c "npm install && node src/app.js"
    env_file: .env
    restart: unless-stopped
    networks:
      - sa-net
    depends_on:
      - postgres
      - redis
      - emqx

  # ─────────────────────────────────────────────────
  # Database — TimescaleDB (PostgreSQL + time-series)
  # ─────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartair}
      POSTGRES_USER: ${POSTGRES_USER:-smartair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # Cache + command queue
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sa-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --save 60 1 --loglevel warning
    volumes:
      - ./redis/data:/data
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # Grafana — telemetry dashboards (TimescaleDB datasource)
  # Access: https://<domain>/grafana
  # ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sa-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./grafana/data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # pgAdmin — database management UI
  # Access: http://<pi-ip>:5050  (LAN only; use SSH tunnel for remote)
  # ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sa-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # Portainer — Docker management UI
  # Access: http://<pi-ip>:9000  (LAN only)
  # ─────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: sa-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data
    restart: unless-stopped
    networks:
      - sa-net

  # ─────────────────────────────────────────────────
  # Cloudflare Tunnel — public ingress, zero open ports
  # See .env.example for how to get CLOUDFLARE_TUNNEL_TOKEN
  # ─────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sa-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - sa-net

volumes: {}

networks:
  sa-net:
    driver: bridge
