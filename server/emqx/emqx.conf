## Smart Air — EMQX 6.x configuration
## Phase 1.2: TLS on 8883, disable anonymous, per-device auth + ACL

## ── Dashboard ─────────────────────────────────────────────────────────────────
## Required in EMQX 6.x — HTTP listener not started without explicit bind
dashboard {
  listeners {
    http {
      bind = "0.0.0.0:18083"
    }
  }
}

## ── REST API keys ────────────────────────────────────────────────────────────
## Format per line: api_key:api_secret:role
api_key {
  bootstrap_file = "/opt/emqx/etc/api-key.bootstrap"
}

## ── Node (required — replaces defaults lost when mounting custom emqx.conf) ───
node {
  name     = "emqx@127.0.0.1"
  ## cookie set via EMQX_NODE__COOKIE env var in docker-compose.yml
  data_dir = "/opt/emqx/data"
}

## ── Listeners ─────────────────────────────────────────────────────────────────
## Note: anonymous access denied via authentication chain below (SEC-04)
## mqtt.allow_anonymous removed — field does not exist in EMQX 5.x

## Plain MQTT 1883 — internal Docker network only (NOT exposed to host)
## SEC-04 applies to device-to-broker (ESP32 → EMQX via 8883 TLS).
## The API bridge (sa-api → EMQX) uses 1883 within the Docker sa-net network.
## Port 1883 has no host port mapping in docker-compose.yml — unreachable from LAN.
listeners.tcp.default {
  enabled = true
  bind = "0.0.0.0:1883"
}

## MQTT/TLS 8883 — ESP32 firmware connection
listeners.ssl.default {
  enabled = true
  bind = "0.0.0.0:8883"
  max_connections = 512
  ssl_options {
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile  = "/opt/emqx/etc/certs/server.key"
    ## verify_none: client does not need to present cert
    ## ESP32 embeds server.crt as CA cert to verify server identity
    verify   = verify_none
    versions = ["tlsv1.3", "tlsv1.2"]
  }
}

## WebSocket 8083 — Flutter app via nginx /mqtt proxy
listeners.ws.default {
  enabled = true
  bind = "0.0.0.0:8083"
}

listeners.wss.default {
  enabled = false
}

## ── Authentication ────────────────────────────────────────────────────────────
## username = deviceId, password = secret_key (set per device in Phase 3.4)
authentication = [
  {
    mechanism = password_based
    backend   = built_in_database
    enable    = true
    password_hash_algorithm {
      name          = sha256
      salt_position = suffix
    }
  }
]

## ── MQTT session ──────────────────────────────────────────────────────────────
## Keep device sessions alive for 2h across restarts; needed for QoS 1 delivery.
mqtt {
  session_expiry_interval = 2h
  max_inflight = 32
}

## ── Authorization (ACL) ───────────────────────────────────────────────────────
## Default deny — client can only access topics explicitly granted
## Per-device rules set via API in Phase 3.4 (device registration)
authorization {
  no_match    = deny
  deny_action = disconnect
  cache {
    enable   = true
    max_size = 32
    ttl      = 1m
  }
  sources = [
    {
      type   = built_in_database
      enable = true
    }
  ]
}
