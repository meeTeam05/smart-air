worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    gzip       on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ── API (Fastify placeholder → real API in Phase 3) ───────────
        location /api/ {
            proxy_pass         http://api:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Grafana dashboards ─────────────────────────────────────────
        # Grafana configured with GF_SERVER_SERVE_FROM_SUB_PATH=true
        location /grafana/ {
            proxy_pass       http://grafana:3000;
            proxy_set_header Host     $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── MQTT over WebSocket — Flutter app ─────────────────────────
        # Flutter connects: wss://<domain>/mqtt
        location /mqtt {
            proxy_pass         http://emqx:8083;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Nginx self-health — smoke test target ──────────────────────
        location = /nginx/health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
