worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    gzip       on;
    keepalive_timeout 65;

    # Docker internal DNS — required for upstream hostname resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── HTTPS — OTA firmware file server ─────────────────────────────────────
    # Uses EMQX self-signed cert (SAN includes 192.168.1.16 + localhost).
    # ESP32 firmware has this CA cert embedded — OTA downloads resolve correctly.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # OTA firmware binaries — PUT files in server/ota-files/ on the Pi
        location /ota/ {
            root /var/www;
            autoindex off;
            add_header Content-Type application/octet-stream;
        }

        # Health check
        location = /nginx/health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx-https"}';
            add_header Content-Type application/json;
        }
    }

    server {
        listen 80;
        server_name _;

        # ── API ───────────────────────────────────────────────────────
        location /api/ {
            set $upstream http://api:3000;
            proxy_pass         $upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Grafana ───────────────────────────────────────────────────
        location /grafana/ {
            set $upstream http://grafana:3000;
            proxy_pass       $upstream;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── MQTT over WebSocket ───────────────────────────────────────
        location /mqtt {
            set $upstream http://emqx:8083;
            proxy_pass         $upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Nginx self-health ─────────────────────────────────────────
        location = /nginx/health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
