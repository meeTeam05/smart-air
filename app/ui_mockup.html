<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background-color: #F7F9FC; }
    .glass-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      position: relative;
      overflow: hidden;
    }
    .active-card {
      border: 1px solid rgba(59, 130, 246, 0.5);
    }
    .pill {
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 6px 20px;
      color: #64748B;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }
    .pill.active {
      background: #1E293B;
      border-color: #1E293B;
      color: white;
      font-weight: 700;
    }
    .header-icon {
      background: white;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
      border-radius: 50%;
      height: 40px;
      width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .online-dot {
      height: 8px;
      width: 8px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
    }
    .sensor-chip {
      background: rgba(0,0,0,0.03);
      border-radius: 6px;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
    }
    .circle-icon {
      height: 42px;
      width: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-icon.blue { background: #EFF6FF; color: #3B82F6; }
    .circle-icon.gray { background: #F1F5F9; color: #94A3B8; }
  </style>
</head>
<body class="antialiased min-h-screen pb-10 max-w-sm mx-auto shadow-2xl relative overflow-hidden">
  
  <!-- Content -->
  <div class="px-6 pt-12 pb-4 flex justify-between items-end">
    <div>
      <p class="text-[16px] text-[#8A93A6] font-medium tracking-wide">Good Morning,</p>
      <h1 class="text-3xl text-slate-800 font-extrabold tracking-tight mt-1">My Home</h1>
    </div>
    <div class="header-icon">
      <svg class="w-6 h-6 text-slate-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </div>
  </div>

  <div class="flex gap-3 px-6 overflow-x-auto pb-4 pt-2 hide-scrollbar">
    <div class="pill active flex-shrink-0">All Devices</div>
    <div class="pill flex-shrink-0">Living Room</div>
    <div class="pill flex-shrink-0">Bedroom</div>
    <div class="pill flex-shrink-0">Kitchen</div>
  </div>

  <div class="grid grid-cols-2 gap-4 px-6 mt-4">
    
    <!-- Card 1 -->
    <div class="glass-card active-card p-4 flex flex-col justify-between aspect-[0.85]">
      <div class="flex justify-between items-start">
        <div class="circle-icon blue">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19,11H5a1,1,0,0,1,0-2H19a1,1,0,0,1,0,2Zm-2,4H7a1,1,0,0,1,0-2H17a1,1,0,0,1,0,2Zm3-8H4A1,1,0,0,1,4,5H20a1,1,0,0,1,0,2Z"/></svg>
        </div>
        <div class="online-dot mt-2 mr-1"></div>
      </div>
      <div class="mt-4">
        <h3 class="text-[15px] font-bold text-slate-800 truncate">Smart Air ED:8C</h3>
        <p class="text-xs font-medium text-slate-400 mt-0.5">Air Purifier</p>
        <div class="flex gap-2 mt-3">
          <div class="sensor-chip text-amber-500">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M15,13V5A3,3,0,0,0,9,5v8a5,5,0,1,0,6,0Zm-3,7a3,3,0,0,1-1.5-5.6V5a1.5,1.5,0,0,1,3,0v9.4A3,3,0,0,1,12,20Z"/></svg>
            26.0°
          </div>
          <div class="sensor-chip text-blue-500">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12,22A7,7,0,0,1,7,10.15c.53-1.63,2.44-4.8,4.35-7.4a.79.79,0,0,1,1.3,0c1.91,2.6,3.82,5.77,4.35,7.4A7,7,0,0,1,12,22Z"/></svg>
            62.0%
          </div>
        </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="glass-card p-4 flex flex-col justify-between aspect-[0.85]">
      <div class="flex justify-between items-start">
        <div class="circle-icon blue">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M14,19.5a1.5,1.5,0,1,1-1.5-1.5A1.5,1.5,0,0,1,14,19.5Zm-8-4a1.5,1.5,0,1,1-1.5-1.5A1.5,1.5,0,0,1,6,15.5Zm12,0a1.5,1.5,0,1,1-1.5-1.5A1.5,1.5,0,0,1,18,15.5Zm-6-7A5.5,5.5,0,1,0,6.5,14H17.5A5.5,5.5,0,0,0,12,8.5Z"/></svg>
        </div>
        <div class="online-dot mt-2 mr-1"></div>
      </div>
      <div class="mt-4">
        <h3 class="text-[15px] font-bold text-slate-800 truncate">Balcony Sensor</h3>
        <p class="text-xs font-medium text-slate-400 mt-0.5">Sensor</p>
        <div class="flex gap-2 mt-3">
          <div class="sensor-chip text-amber-500">
            28.1°
          </div>
          <div class="sensor-chip text-blue-500">
            80.5%
          </div>
        </div>
      </div>
    </div>

    <!-- Card 3 -->
    <div class="glass-card p-4 flex flex-col justify-between aspect-[0.85]">
      <div class="flex justify-between items-start">
        <div class="circle-icon gray">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10,10-4.48,10-10S17.52,2,12,2ZM11,19.93A8,8,0,0,1,4.07,13H11Zm0-8.93H4.07A8,8,0,0,1,11,4.07Zm2-6.93a8,8,0,0,1,6.93,6.93H13ZM13,13h6.93A8,8,0,0,1,13,19.93Z"/></svg>
        </div>
        <div class="mt-1 px-1.5 rounded-md bg-slate-100 text-[10px] text-slate-400 font-bold uppercase tracking-wider">Offline</div>
      </div>
      <div class="mt-4">
        <h3 class="text-[15px] font-bold text-slate-800 truncate">Robot Vac</h3>
        <p class="text-xs font-medium text-slate-400 mt-0.5">Appliance</p>
        <div class="flex gap-2 mt-3 opacity-0">...</div>
      </div>
    </div>

  </div>

</body>
</html>
