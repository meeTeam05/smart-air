name: smart_air
description: Smart Air — Air Quality Monitor & Controller
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # BLE + permissions (existing)
  flutter_blue_plus: ^1.33.0
  permission_handler: ^11.3.1
  wifi_scan: ^0.4.1
  # State management
  flutter_riverpod: ^2.5.1
  # Navigation
  go_router: ^14.2.7
  # HTTP
  dio: ^5.4.3
  # Auth storage
  flutter_secure_storage: ^9.2.2
  # Models (runtime annotations only)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # Charts
  fl_chart: ^0.68.0
  # UI
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  # Code generation (models only)
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: false
